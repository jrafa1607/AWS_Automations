name: ShellCheck

on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: |
          shellcheck --version
          find . -name '*.sh' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR
